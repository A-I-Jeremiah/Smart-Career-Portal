services:
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: career-fastapi
    ports:
      - "9000:9000"          # Maps host 3000 → container 3000
    env_file:
      - .env
    volumes:
      - ./career_portal.db:/app/career_portal.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build: .
    container_name: career-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - FASTAPI_BASE_URL=http://fastapi:9000   # Internal Docker network
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: career-react
    ports:
      - "5173:80"             # Maps host 5173 -> container 80
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped